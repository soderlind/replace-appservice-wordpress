<VirtualHost *:80>
	# WordPress lives on the persistent Azure Files share, not in the image.
	DocumentRoot /home/site/wwwroot

	<Directory /home/site/wwwroot>
		Options FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	# Application passwords, REST Basic auth and Composer all authenticate with an
	# Authorization header; some plugins read the raw header rather than PHP_AUTH_USER.
	SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

	# TLS is terminated upstream (Front Door / the App Service front end).
	SetEnvIf X-Forwarded-Proto "https" HTTPS=on

	ErrorLog /dev/stderr
	CustomLog /dev/stdout combined
</VirtualHost>
