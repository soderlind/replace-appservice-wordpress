name: Build and push container image

on:
  push:
    branches:
      - main
    paths:
      - 'docker/**'
      - '.github/workflows/build-image.yml'

concurrency:
  group: wordpress-image
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build and push to ACR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Lets the workflow no-op in a fork or before the OIDC federation is set up, instead of
      # failing every push.
      ENV_CONFIGURED: ${{ secrets.AZURE_CLIENT_ID != '' && vars.REGISTRY_NAME != '' }}
      REGISTRY_NAME: ${{ vars.REGISTRY_NAME }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME || 'wordpress' }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Azure login
        if: ${{ env.ENV_CONFIGURED == 'true' }}
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        if: ${{ env.ENV_CONFIGURED == 'true' }}
        run: |
          az acr build \
            --registry "$REGISTRY_NAME" \
            --image "$IMAGE_NAME:$IMAGE_TAG" \
            --platform linux/amd64 \
            docker

      - name: Report the digest to pin
        if: ${{ env.ENV_CONFIGURED == 'true' }}
        run: |
          digest="$(az acr repository show \
            --name "$REGISTRY_NAME" \
            --image "$IMAGE_NAME:$IMAGE_TAG" \
            --query digest --output tsv)"
          # Also on stdout: step summaries are not reachable through the REST API.
          echo "$IMAGE_NAME:$IMAGE_TAG resolves to $digest"
          {
            echo "### Image published"
            echo ""
            echo "Tag \`$IMAGE_TAG\` resolves to \`$digest\`."
            echo ""
            echo '```'
            echo "param imageVersion = '$digest'"
            echo '```'
            echo ""
            echo "Set this in \`bicep/site.bicepparam\` and merge to deploy."
          } >> "$GITHUB_STEP_SUMMARY"
