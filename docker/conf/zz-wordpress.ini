memory_limit = 512M
max_execution_time = 300

; post_max_size must be >= upload_max_filesize or the smaller value silently wins.
upload_max_filesize = 512M
post_max_size = 512M

expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 2
